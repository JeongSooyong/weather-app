<!-- 이 문서가 최신 HTML 규격을 사용함을 브라우저에 알립니다. -->
<!DOCTYPE html>
<!-- 페이지의 기본 언어를 한국어로 설정합니다. -->
<html lang="ko">
  <head>
    <!-- 한글을 포함한 문자를 올바르게 표시하는 문자 인코딩입니다. -->
    <meta charset="UTF-8" />
    <!-- 휴대폰 화면 크기에 맞춰 페이지 폭을 조정합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 브라우저 탭에 표시할 제목입니다. -->
    <title>날씨 조회</title>
  </head>
  <body>
    <!-- React가 날씨 조회 화면을 그려 넣을 빈 공간입니다. -->
    <div id="root"></div>
    <!-- React 앱을 시작하는 TypeScript 파일입니다. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
